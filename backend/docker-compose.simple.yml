services:
  mysql:
    image: mysql:8.0
    container_name: image_search_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-image_search_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_app_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_network
    command: --default-authentication-plugin=mysql_native_password --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: image_search_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: image_search_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_rabbit_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.cpu-only
    container_name: image_search_app
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:-secure_app_password}@mysql:3306/${MYSQL_DATABASE:-image_search_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secure_rabbit_password}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this}
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/2
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
    ports:
      - "5000:5000"
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu-only
    container_name: image_search_celery_worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:-secure_app_password}@mysql:3306/${MYSQL_DATABASE:-image_search_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secure_rabbit_password}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  backend_network:
    driver: bridge