services:
  postgresql:
    image: postgres:15-alpine
    container_name: image_search_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_search_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-image_search_db}"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: image_search_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: image_search_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_rabbit_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image_search_app
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-secure_app_password}@postgresql:5432/${POSTGRES_DB:-image_search_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secure_rabbit_password}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this}
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/2
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image_search_celery_worker
    restart: unless-stopped
    command: celery -A main.celery worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-secure_app_password}@postgresql:5432/${POSTGRES_DB:-image_search_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secure_rabbit_password}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./static:/app/static
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  postgresql_data:
  redis_data:
  rabbitmq_data:

networks:
  backend_network:
    driver: bridge