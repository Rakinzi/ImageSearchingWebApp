<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1, h2 {
            text-align: center;
        }
        #faces, #related-images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .thumbnail:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Face Recognition App</h1>
    <h2>Detected Faces</h2>
    <div id="faces"></div>
    <h2>Related Images</h2>
    <div id="related-images"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/process')
                .then(response => response.json())
                .then(data => {
                    console.log(data)
                    const facesContainer = document.getElementById('faces');
                    data.face_images.forEach((imagePath, index) => {
                        const img = document.createElement('img');
                        img.src = `/image/${imagePath}`;
                        img.classList.add('thumbnail');
                        img.setAttribute('data-face-id', index);
                        img.addEventListener('click', () => showRelatedImages(index));
                        facesContainer.appendChild(img);
                    });
                });
        });

        function showRelatedImages(faceId) {
            fetch(`/related_images/${faceId}`)
                .then(response => response.json())
                .then(data => {
                    const relatedImagesContainer = document.getElementById('related-images');
                    relatedImagesContainer.innerHTML = '';
                    data.related_images.forEach(imagePath => {
                        const img = document.createElement('img');
                        img.src = `/image/${imagePath}`;
                        img.classList.add('thumbnail');
                        relatedImagesContainer.appendChild(img);
                    });
                });
        }
    </script>
</body>
</html>
